<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- handoff reference copy of a template -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:390px;min-height:844px;margin:0 auto;background:var(--fog);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column">
  <div style="position:sticky;top:0;z-index:5;background:var(--fog);display:flex;align-items:center;justify-content:center;padding:18px 16px 12px;position:relative">
    <div style="position:absolute;left:16px;width:32px;height:32px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--canopy);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round"><path d="M15 5l-7 7 7 7"></path></svg>
    </div>
    <div style="font-size:15px;font-weight:700;letter-spacing:-.01em">Notifications</div>
  </div>
  <div style="flex:1;padding:0 16px 28px">
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--canopy);margin:20px 4px 10px">Daily</div>
    <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.Card" padding="4px 16px" hint-size="100%,190px">
      <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.SettingsRow" label="Morning reading" description="One note when your scores are ready" control="toggle" on="{{ true }}" first="{{ true }}" hint-size="100%,62px"></x-import>
      <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.SettingsRow" label="Evening wind-down" description="A reminder ahead of your bedtime window" value="9:45p" hint-size="100%,62px"></x-import>
      <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.SettingsRow" label="Weekly report" description="Sunday summary of the week's trends" control="toggle" on="{{ true }}" hint-size="100%,62px"></x-import>
    </x-import>

    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--canopy);margin:20px 4px 10px">Signals</div>
    <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.Card" padding="4px 16px" hint-size="100%,190px">
      <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.SettingsRow" label="Out-of-range alerts" description="Heart rate or temperature outside your range" control="toggle" on="{{ true }}" first="{{ true }}" hint-size="100%,62px"></x-import>
      <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.SettingsRow" label="Goal milestones" description="When you reach a target early" control="toggle" on="{{ false }}" hint-size="100%,62px"></x-import>
      <x-import component-from-global-scope="NguyenInDoubtDataDisplaysOuraStyle_d0b3eb.SettingsRow" label="Ring battery &amp; sync" description="Low charge or a missed sync" control="toggle" on="{{ true }}" hint-size="100%,62px"></x-import>
    </x-import>

    <sc-if value="{{ showNote }}" hint-placeholder-val="{{ true }}">
      <p style="font-size:12px;color:var(--faint);line-height:1.6;margin:18px 0 0;text-align:center;padding:0 12px">We only write when there's something worth knowing — never streaks, never guilt.</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;showNote&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  applyTheme() {
    const theme = this.props.theme ?? 'light';
    document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
    document.body.style.background = theme === 'dark' ? '#050806' : '#E9ECE3';
  }
  componentDidMount() { this.applyTheme(); }
  componentDidUpdate() { this.applyTheme(); }
  renderVals() {
    return { showNote: this.props.showNote ?? true };
  }
}
</script>
</body>
</html>
