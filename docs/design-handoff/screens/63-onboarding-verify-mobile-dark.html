<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify code · mobile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#E8EEE2;--canopy:#8FB56A;--moss:#7FA45E;--sage:#A9BA92;--mint:#26332A;--fog:#0B120F;--ember:#E08A63;--line:rgba(232,238,226,.12);--muted:#9DA99B;--faint:#7C8A7E;--surface:#18211A;--onaccent:#0B120F;--desk:#050806}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--desk);color:var(--ink)}
  a{color:var(--canopy)}a:hover{color:var(--moss)}
  .phone{width:390px;min-height:844px;margin:0 auto;background:var(--fog);display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:center;padding:22px 16px 6px;position:relative}
  .back{position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .back svg{width:16px;height:16px;stroke:var(--canopy);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dots{display:flex;gap:6px}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--mint)}
  .dot.on{width:18px;background:var(--canopy)}
  .scroll{flex:1;padding:0 24px 28px;display:flex;flex-direction:column}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.18;margin-top:22px;color:var(--canopy)}
  .sub{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
  .sub b{color:var(--ink);font-weight:600}
  .code{display:flex;gap:9px;margin-top:28px}
  .cbox{flex:1;aspect-ratio:.82;background:var(--surface);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--ink)}
  .cbox.active{border:1.5px solid var(--canopy)}
  .cbox .caret{width:2px;height:22px;background:var(--canopy);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .resend{font-size:13px;color:var(--muted);margin-top:18px;text-align:center}
  .resend a{font-weight:600;text-decoration:none}
  .spacer{flex:1;min-height:18px}
  .cta{display:block;width:100%;border:0;background:var(--canopy);color:var(--onaccent);font:inherit;font-size:15px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;text-align:center}
  .skip{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px;text-decoration:none}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="back" onclick="location.href='61-onboarding-email-mobile-dark.html'"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="scroll">
      <h1>Check your inbox</h1>
      <p class="sub">We sent a 6-digit code to <b>mai.tran@gmail.com</b>. It's good for 10 minutes.</p>
      <div class="code">
        <div class="cbox">4</div>
        <div class="cbox">8</div>
        <div class="cbox">2</div>
        <div class="cbox active"><span class="caret"></span></div>
        <div class="cbox"></div>
        <div class="cbox"></div>
      </div>
      <p class="resend">Nothing yet? <a href="#">Resend code</a> · <a href="61-onboarding-email-mobile-dark.html">Change email</a></p>
      <div class="spacer"></div>
      <button class="cta" onclick="location.href='46-onboarding-permissions-mobile-dark.html'">Verify</button>
      <a href="#" class="skip">Having trouble?</a>
    </div>
  </div>
</body>
</html>
