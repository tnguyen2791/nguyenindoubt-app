<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity rings</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#17211B;--canopy:#1E4A34;--moss:#5D7F43;--sage:#A9BA92;--mint:#E4EDDD;--fog:#F6F7F1;--ember:#C56844;--line:rgba(30,74,52,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--fog);color:var(--ink);padding:28px}
  .card{max-width:460px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;gap:24px;align-items:center}
  .rings{position:relative;width:170px;height:170px;flex-shrink:0}
  .rings svg{transform:rotate(-90deg)}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .num{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .num small{font-size:13px;color:#54635a;display:block;font-weight:600;margin-top:2px}
  .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--canopy)}
  .legend{display:flex;flex-direction:column;gap:14px;margin-top:12px}
  .row{display:flex;align-items:center;gap:10px}
  .chip{width:10px;height:10px;border-radius:99px}
  .rl{font-size:13px;font-weight:600;color:#33413a}
  .rv{font-size:12px;color:#7a887f;margin-left:auto}
</style>
</head>
<body>
  <div class="card">
    <div class="rings">
      <svg width="170" height="170" viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="70" fill="none" stroke="var(--mint)" stroke-width="12"/>
        <circle cx="85" cy="85" r="70" fill="none" stroke="var(--canopy)" stroke-width="12" stroke-linecap="round" stroke-dasharray="440" stroke-dashoffset="70"/>
        <circle cx="85" cy="85" r="54" fill="none" stroke="var(--mint)" stroke-width="12"/>
        <circle cx="85" cy="85" r="54" fill="none" stroke="var(--moss)" stroke-width="12" stroke-linecap="round" stroke-dasharray="339" stroke-dashoffset="95"/>
        <circle cx="85" cy="85" r="38" fill="none" stroke="var(--mint)" stroke-width="12"/>
        <circle cx="85" cy="85" r="38" fill="none" stroke="var(--sage)" stroke-width="12" stroke-linecap="round" stroke-dasharray="239" stroke-dashoffset="30"/>
      </svg>
      <div class="center"><div class="num">88<small>activity</small></div></div>
    </div>
    <div>
      <div class="k">Daily movement</div>
      <div class="legend">
        <div class="row"><span class="chip" style="background:var(--canopy)"></span><span class="rl">Move goal</span><span class="rv">420 / 500 cal</span></div>
        <div class="row"><span class="chip" style="background:var(--moss)"></span><span class="rl">Steps</span><span class="rv">9.2k / 10k</span></div>
        <div class="row"><span class="chip" style="background:var(--sage)"></span><span class="rl">Stand hours</span><span class="rv">11 / 12 hr</span></div>
      </div>
    </div>
  </div>
</body>
</html>
