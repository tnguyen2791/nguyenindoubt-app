<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First run · mobile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#E8EEE2;--canopy:#8FB56A;--moss:#7FA45E;--sage:#A9BA92;--mint:#26332A;--fog:#0B120F;--ember:#E08A63;--line:rgba(232,238,226,.12);--surface:#18211A;--muted:#9DA99B;--faint:#7C8A7E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#050806;color:var(--ink)}
  a{color:var(--canopy)}a:hover{color:var(--moss)}
  .phone{width:390px;min-height:844px;margin:0 auto;background:var(--fog);position:relative;display:flex;flex-direction:column;
    background-image:
      radial-gradient(1.4px 1.4px at 40px 80px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 180px 140px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.2px 1.2px at 300px 60px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 90px 260px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.3px 1.3px at 340px 320px, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 220px 400px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 60px 460px, rgba(255,255,255,.45), transparent),
      radial-gradient(1.1px 1.1px at 320px 520px, rgba(255,255,255,.5), transparent);
    background-size:390px 620px;}
  .scroll{flex:1;padding:0 16px 24px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px}
  .brand{display:flex;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .in{color:var(--ember)}
  .avatar{width:32px;height:32px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--canopy)}
  .intro{text-align:center;padding:14px 6px 2px}
  .intro .ghello{font-size:13px;font-weight:600;color:var(--muted)}
  .intro h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
  .intro .sub{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45;max-width:280px;margin-left:auto;margin-right:auto}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:12px}
  .disc{position:relative;width:120px;height:120px}
  .disc .bg{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
  .disc .track{position:absolute;inset:0;border-radius:99px;border:5px dashed rgba(255,255,255,.14)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .content svg{width:24px;height:24px;stroke:#9DB07E;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{font-size:26px;font-weight:700;color:#6C7A6E;line-height:1}
  .label{font-size:14px;font-weight:600;color:var(--muted)}
  .spacer{flex:1;min-height:20px}
  .synccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;margin-top:22px}
  .ringdot{width:44px;height:44px;border-radius:99px;border:3px solid var(--canopy);flex-shrink:0;position:relative}
  .ringdot::after{content:"";position:absolute;inset:7px;border-radius:99px;background:var(--mint)}
  .sc-t{font-size:14px;font-weight:700}
  .sc-s{font-size:12px;color:var(--muted);margin-top:2px}
  .cta{display:block;width:100%;border:0;background:var(--canopy);color:#0B120F;font:inherit;font-size:15px;font-weight:700;padding:15px;border-radius:14px;margin-top:14px;cursor:pointer;text-align:center}
  .skip{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px;text-decoration:none}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="brand">Nguyen<span class="in">In</span>Doubt</div>
      <span class="avatar">M</span>
    </div>
    <div class="scroll">
      <div class="intro">
        <div class="ghello">Welcome, Minh</div>
        <h1>Let's get your first reading</h1>
        <div class="sub">Your metrics fill in as you share sleep and recovery data over time.</div>
      </div>
      <div class="tiles">
        <div class="tile">
          <div class="disc"><div class="bg"></div><div class="track"></div>
            <div class="content"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-3-2.4-5.2-5.6-5.2C6.4 11 8.6 13 12 13Z"/><path d="M12 13c0-2.6 2-4.6 4.8-4.6C16.8 11.2 15 13 12 13Z"/></svg><div class="dash">—</div></div>
          </div>
          <div class="label">Readiness</div>
        </div>
        <div class="tile">
          <div class="disc"><div class="bg"></div><div class="track"></div>
            <div class="content"><svg viewBox="0 0 24 24"><path d="M20.5 14.5A8 8 0 1 1 9.5 3.5a6.5 6.5 0 0 0 11 11Z"/></svg><div class="dash">—</div></div>
          </div>
          <div class="label">Sleep</div>
        </div>
        <div class="tile">
          <div class="disc"><div class="bg"></div><div class="track"></div>
            <div class="content"><svg viewBox="0 0 24 24"><path d="M12 3c2 3 5 4.6 5 8.6a5 5 0 0 1-10 0c0-1.6.7-2.9 1.6-3.9.2 1.4.9 2.2 1.9 2.4C10.2 8 11 5.6 12 3Z"/></svg><div class="dash">—</div></div>
          </div>
          <div class="label">Activity</div>
        </div>
        <div class="tile">
          <div class="disc"><div class="bg"></div><div class="track"></div>
            <div class="content"><svg viewBox="0 0 24 24"><path d="M12 20C12 20 4 15.2 4 9.2 4 6.4 6.2 5 8.5 6.2 10 7 12 8.8 12 8.8 12 8.8 14 7 15.5 6.2 17.8 5 20 6.4 20 9.2 20 15.2 12 20 12 20Z"/></svg><div class="dash">—</div></div>
          </div>
          <div class="label">Heart rate</div>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="cta">Continue</button>
      <a href="#" class="skip">Explore the app first</a>
    </div>
  </div>
</body>
</html>
