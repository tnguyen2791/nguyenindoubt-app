<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overnight heart rate</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#17211B;--canopy:#1E4A34;--moss:#5D7F43;--sage:#A9BA92;--mint:#E4EDDD;--fog:#F6F7F1;--ember:#C56844;--line:rgba(30,74,52,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--fog);color:var(--ink);padding:28px}
  .card{max-width:560px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
  .head{display:flex;align-items:baseline;justify-content:space-between}
  .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--canopy)}
  .val{font-size:13px;font-weight:600;color:var(--moss)}
  .hero{display:flex;align-items:baseline;gap:8px;margin-top:8px}
  .big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .big small{font-size:18px;color:#54635a}
  .chart{margin-top:18px}
  .axis{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#7a887f}
  .foot{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .stat .n{font-size:20px;font-weight:700}
  .stat .l{font-size:12px;color:#54635a}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="k">Overnight heart rate</div>
      <div class="val">lowest at 3:48a</div>
    </div>
    <div class="hero"><div class="big">51<small>bpm</small></div><div class="val">resting low — recovered</div></div>
    <div class="chart">
      <svg width="100%" height="150" viewBox="0 0 520 150" preserveAspectRatio="none">
        <line x1="0" y1="40" x2="520" y2="40" stroke="rgba(30,74,52,.08)" stroke-width="1"/>
        <line x1="0" y1="80" x2="520" y2="80" stroke="rgba(30,74,52,.08)" stroke-width="1"/>
        <line x1="0" y1="120" x2="520" y2="120" stroke="rgba(30,74,52,.08)" stroke-width="1"/>
        <polygon points="0,150 0,42 58,58 116,50 174,72 232,90 290,104 348,96 406,78 464,60 520,50 520,150" fill="rgba(30,74,52,.10)"/>
        <polyline points="0,42 58,58 116,50 174,72 232,90 290,104 348,96 406,78 464,60 520,50" fill="none" stroke="#1E4A34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="290" cy="104" r="5" fill="#1E4A34"/>
      </svg>
      <div class="axis"><span>11p</span><span>1a</span><span>3a</span><span>5a</span><span>7a</span></div>
    </div>
    <div class="foot">
      <div class="stat"><div class="n">51</div><div class="l">lowest bpm</div></div>
      <div class="stat"><div class="n">62</div><div class="l">average bpm</div></div>
      <div class="stat"><div class="n">3:48a</div><div class="l">dip time</div></div>
    </div>
  </div>
</body>
</html>
