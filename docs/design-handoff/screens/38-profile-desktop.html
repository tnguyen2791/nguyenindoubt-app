<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Profile · desktop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#17211B;--canopy:#1E4A34;--moss:#5D7F43;--sage:#A9BA92;--mint:#E4EDDD;--fog:#F6F7F1;--ember:#C56844;--line:rgba(30,74,52,.14);--muted:#54635a;--faint:#7a887f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--fog);color:var(--ink);padding:32px 28px 48px;min-height:100vh}
  a{color:var(--canopy)}a:hover{color:var(--moss)}
  .page{max-width:1120px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .in{color:var(--ember)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.015em;margin-top:26px}
  .grid{display:grid;grid-template-columns:5fr 7fr;gap:16px;margin-top:20px;align-items:start}
  .col{display:flex;flex-direction:column;gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
  .me{display:flex;align-items:center;gap:16px}
  .pic{width:64px;height:64px;border-radius:99px;background:var(--canopy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex-shrink:0}
  .me .n{font-size:19px;font-weight:700}
  .me .m{font-size:13px;font-weight:600;color:var(--moss);margin-top:3px}
  .ring{display:flex;align-items:center;gap:14px}
  .ringdot{width:44px;height:44px;border-radius:99px;border:3px solid var(--moss);flex-shrink:0;position:relative}
  .ringdot::after{content:"";position:absolute;inset:7px;border-radius:99px;background:var(--mint)}
  .r-t{font-size:15px;font-weight:700}
  .r-s{font-size:13px;color:var(--muted);margin-top:2px}
  .bat{margin-left:auto;font-size:13px;font-weight:700;color:var(--moss)}
  .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--canopy);margin-bottom:6px}
  .group .row{display:flex;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line);cursor:pointer}
  .group .row:first-of-type{border-top:0}
  .ic{width:20px;height:20px;stroke:var(--canopy);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .rl{font-size:14px;font-weight:600}
  .rv{margin-left:auto;font-size:13px;color:var(--faint)}
  .chev{width:16px;height:16px;stroke:var(--faint);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-left:8px}
  .signout{border:1px solid var(--line);background:#fff;color:var(--ember);font:inherit;font-size:14px;font-weight:700;padding:14px;border-radius:14px;cursor:pointer;width:100%}
</style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="brand">Nguyen<span class="in">In</span>Doubt</div>
    </div>
    <h1>Profile</h1>
    <div class="grid">
      <div class="col">
        <div class="card">
          <div class="me">
            <div class="pic">M</div>
            <div><div class="n">Minh Nguyen</div><div class="m">Member · joined Mar 2025</div></div>
          </div>
        </div>
        <button class="signout">Sign out</button>
      </div>
      <div class="col">
        <div class="card group">
          <div class="k">Account</div>
          <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="rl">Personal info</span><span class="rv">Minh Nguyen</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
          <div class="row" onclick="location.href='56-settings-goals-desktop.html'" style="cursor:pointer"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2.5 2.5"/></svg><span class="rl">Goals &amp; targets</span><span class="rv">8h sleep · 500 cal</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
          <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg><span class="rl">Units</span><span class="rv">Metric</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
        <div class="card group">
          <div class="k">Preferences</div>
          <div class="row" onclick="location.href='58-settings-notifications-desktop.html'" style="cursor:pointer"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 6h16s-2-1-2-6a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"/></svg><span class="rl">Notifications</span><span class="rv">On</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
          <div class="row"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span class="rl">Privacy &amp; data</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
        <div class="card group">
          <div class="k">Sharing</div>
          <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 3.6-6 8-6 1.5 0 2.9.2 4 .7"/><path d="M17 11l2 2 4-4"/></svg><span class="rl">Share with your provider</span><span class="rv">Dr. Nguyen</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
          <div class="row" onclick="location.href='88-sharing-invite-code-desktop.html'" style="cursor:pointer"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3"/><path d="M8 13h.01M12 13h.01M16 13h.01"/></svg><span class="rl">Request to share</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
        <div class="card group">
          <div class="k">Support</div>
          <div class="row"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4 2c0 1.5-2 2-2 3.5M12 17.5h.01"/></svg><span class="rl">Help center</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
          <div class="row"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v14M8 13l4 4 4-4M5 21h14"/></svg><span class="rl">Export my data</span><svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
