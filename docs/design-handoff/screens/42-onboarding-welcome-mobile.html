<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome · mobile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#17211B;--canopy:#1E4A34;--moss:#5D7F43;--sage:#A9BA92;--mint:#E4EDDD;--fog:#F6F7F1;--ember:#C56844;--line:rgba(30,74,52,.14);--muted:#54635a;--faint:#7a887f;--surface:#ffffff;--onaccent:#ffffff;--desk:#E9ECE3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--desk);color:var(--ink)}
  a{color:var(--canopy)}a:hover{color:var(--moss)}
  .phone{width:390px;min-height:844px;margin:0 auto;background:var(--fog);display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:center;padding:22px 16px 6px}
  .dots{display:flex;gap:6px}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--mint)}
  .dot.on{width:18px;background:var(--canopy)}
  .scroll{flex:1;padding:0 28px 28px;display:flex;flex-direction:column;text-align:center}
  .spacer{flex:1;min-height:18px}
  .hero{position:relative;width:168px;height:168px;margin:26px auto 0}
  .hero svg{position:absolute;inset:0;transform:rotate(-90deg)}
  .mark-lg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .mark-lg span{height:56px;padding:0 15px;border-radius:16px;background:var(--canopy);color:var(--onaccent);display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700;letter-spacing:-.03em}
  .mark-lg i{font-style:normal;color:var(--ember)}
  h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:26px;color:var(--canopy)}
  .sub{font-size:14px;color:var(--muted);line-height:1.5;margin:14px auto 0;max-width:300px}
  .cta{display:block;width:100%;border:0;background:var(--canopy);color:var(--onaccent);font:inherit;font-size:15px;font-weight:700;padding:15px;border-radius:14px;margin-top:12px;cursor:pointer;text-align:center}
  .cta.ghost{background:transparent;color:var(--canopy);border:1.5px solid var(--canopy)}
  .fine{font-size:12px;color:var(--faint);line-height:1.6;margin-top:16px}
  .fine a{font-weight:600}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="scroll">
      <div class="spacer"></div>
      <div class="hero">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <circle cx="84" cy="84" r="76" fill="none" stroke="var(--mint)" stroke-width="8"/>
          <circle cx="84" cy="84" r="76" fill="none" stroke="#4F7A3C" stroke-width="8" stroke-linecap="round" stroke-dasharray="478" stroke-dashoffset="150"/>
          <circle cx="84" cy="84" r="60" fill="none" stroke="var(--mint)" stroke-width="8"/>
          <circle cx="84" cy="84" r="60" fill="none" stroke="var(--moss)" stroke-width="8" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="170"/>
        </svg>
        <div class="mark-lg"><span>N<i>i</i>D</span></div>
      </div>
      <h1>Quiet signals,<br>clear mornings</h1>
      <p class="sub">NguyenInDoubt reads your sleep, recovery, and rhythm — and tells you what it means, not what to fear.</p>
      <div class="spacer"></div>
      <button class="cta" onclick="location.href='43-onboarding-permissions-mobile.html'">Continue with Apple</button>
      <button class="cta ghost" onclick="location.href='60-onboarding-email-mobile.html'">Continue with email</button>
      <p class="fine">Private by design — your data stays yours.<br><a href="#">Terms</a> · <a href="#">Privacy</a></p>
    </div>
  </div>
</body>
</html>
