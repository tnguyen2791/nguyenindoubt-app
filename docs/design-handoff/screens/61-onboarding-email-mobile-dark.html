<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Email sign-in · mobile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#E8EEE2;--canopy:#8FB56A;--moss:#7FA45E;--sage:#A9BA92;--mint:#26332A;--fog:#0B120F;--ember:#E08A63;--line:rgba(232,238,226,.12);--muted:#9DA99B;--faint:#7C8A7E;--surface:#18211A;--onaccent:#0B120F;--desk:#050806}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--desk);color:var(--ink)}
  a{color:var(--canopy)}a:hover{color:var(--moss)}
  .phone{width:390px;min-height:844px;margin:0 auto;background:var(--fog);display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:center;padding:22px 16px 6px;position:relative}
  .back{position:absolute;left:16px;top:14px;width:32px;height:32px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .back svg{width:16px;height:16px;stroke:var(--canopy);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dots{display:flex;gap:6px}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--mint)}
  .dot.on{width:18px;background:var(--canopy)}
  .scroll{flex:1;padding:0 24px 28px;display:flex;flex-direction:column}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.18;margin-top:22px;color:var(--canopy)}
  .sub{font-size:13px;color:var(--muted);line-height:1.5;margin-top:10px}
  .flab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--canopy);margin:26px 4px 8px}
  .input{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--canopy);border-radius:14px;padding:15px 16px}
  .input svg{width:18px;height:18px;stroke:var(--canopy);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .input .v{font-size:15px;font-weight:600}
  .input .caret{width:2px;height:18px;background:var(--canopy);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .fine{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--faint);line-height:1.5;margin-top:14px;padding:0 4px}
  .fine svg{width:15px;height:15px;stroke:var(--moss);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .spacer{flex:1;min-height:18px}
  .cta{display:block;width:100%;border:0;background:var(--canopy);color:var(--onaccent);font:inherit;font-size:15px;font-weight:700;padding:15px;border-radius:14px;cursor:pointer;text-align:center}
  .skip{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px;text-decoration:none}
</style>
</head>
<body>
  <div class="phone">
    <div class="top">
      <div class="back" onclick="location.href='45-onboarding-welcome-mobile-dark.html'"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></div>
      <div class="dots"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="scroll">
      <h1>Sign in with email</h1>
      <p class="sub">We'll send a one-time code — no password to remember.</p>
      <div class="flab">Email</div>
      <div class="input">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg>
        <span class="v">mai.tran@</span><span class="caret"></span>
      </div>
      <p class="fine">
        <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 10-4-1.6-7-5.4-7-10V6l7-3Z"/></svg>
        Used for sign-in and account recovery only. Never for marketing by default.
      </p>
      <div class="spacer"></div>
      <button class="cta" onclick="location.href='63-onboarding-verify-mobile-dark.html'">Send code</button>
      <a href="45-onboarding-welcome-mobile-dark.html" class="skip">Use Apple instead</a>
    </div>
  </div>
</body>
</html>
