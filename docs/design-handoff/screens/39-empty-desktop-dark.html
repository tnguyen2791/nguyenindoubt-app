<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>First run · desktop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root{--ink:#E8EEE2;--canopy:#8FB56A;--moss:#7FA45E;--sage:#A9BA92;--mint:#26332A;--fog:#0B120F;--ember:#E08A63;--line:rgba(232,238,226,.12);--surface:#18211A;--muted:#9DA99B;--faint:#7C8A7E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#0B120F;color:var(--ink);padding:32px 28px 48px;min-height:100vh;
    background-image:
      radial-gradient(1.4px 1.4px at 60px 90px, rgba(255,255,255,.7), transparent),
      radial-gradient(1px 1px at 280px 160px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.2px 1.2px at 520px 70px, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 760px 200px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.3px 1.3px at 980px 120px, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 180px 300px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 640px 360px, rgba(255,255,255,.45), transparent),
      radial-gradient(1.1px 1.1px at 1040px 340px, rgba(255,255,255,.5), transparent);
    background-size:1120px 520px;}
  a{color:var(--canopy)}a:hover{color:var(--moss)}
  .page{max-width:1120px;margin:0 auto}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .brand .in{color:var(--ember)}
  .avatar{width:34px;height:34px;border-radius:99px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--canopy)}
  .hero{max-width:760px;margin:56px auto 0;text-align:center}
  .ghello{font-size:14px;font-weight:600;color:var(--muted)}
  .hero h1{font-size:36px;font-weight:700;letter-spacing:-.02em;margin-top:10px}
  .hero .sub{font-size:15px;color:var(--muted);margin-top:14px;line-height:1.5;max-width:460px;margin-left:auto;margin-right:auto}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:44px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:14px}
  .disc{position:relative;width:150px;height:150px}
  .disc .bg{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
  .disc .track{position:absolute;inset:0;border-radius:99px;border:6px dashed rgba(255,255,255,.14)}
  .content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  .content svg{width:30px;height:30px;stroke:#9DB07E;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dash{font-size:32px;font-weight:700;color:#6C7A6E;line-height:1}
  .label{font-size:15px;font-weight:600;color:var(--muted)}
  .synccard{max-width:520px;margin:44px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;align-items:center;gap:16px}
  .ringdot{width:48px;height:48px;border-radius:99px;border:3px solid var(--canopy);flex-shrink:0;position:relative}
  .ringdot::after{content:"";position:absolute;inset:8px;border-radius:99px;background:var(--mint)}
  .sc-t{font-size:15px;font-weight:700}
  .sc-s{font-size:13px;color:var(--muted);margin-top:2px}
  .cta{margin-left:auto;border:0;background:var(--canopy);color:#0B120F;font:inherit;font-size:14px;font-weight:700;padding:13px 26px;border-radius:12px;cursor:pointer;white-space:nowrap}
  .skip{display:block;text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:18px;text-decoration:none}
</style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div class="brand">Nguyen<span class="in">In</span>Doubt</div>
      <span class="avatar">M</span>
    </div>
    <div class="hero">
      <div class="ghello">Welcome, Minh</div>
      <h1>Let's get your first reading</h1>
      <div class="sub">Your metrics fill in as you share sleep and recovery data over time.</div>
    </div>
    <div class="tiles">
      <div class="tile">
        <div class="disc"><div class="bg"></div><div class="track"></div>
          <div class="content"><svg viewBox="0 0 24 24"><path d="M12 21v-8"/><path d="M12 13c0-3-2.4-5.2-5.6-5.2C6.4 11 8.6 13 12 13Z"/><path d="M12 13c0-2.6 2-4.6 4.8-4.6C16.8 11.2 15 13 12 13Z"/></svg><div class="dash">—</div></div>
        </div>
        <div class="label">Readiness</div>
      </div>
      <div class="tile">
        <div class="disc"><div class="bg"></div><div class="track"></div>
          <div class="content"><svg viewBox="0 0 24 24"><path d="M20.5 14.5A8 8 0 1 1 9.5 3.5a6.5 6.5 0 0 0 11 11Z"/></svg><div class="dash">—</div></div>
        </div>
        <div class="label">Sleep</div>
      </div>
      <div class="tile">
        <div class="disc"><div class="bg"></div><div class="track"></div>
          <div class="content"><svg viewBox="0 0 24 24"><path d="M12 3c2 3 5 4.6 5 8.6a5 5 0 0 1-10 0c0-1.6.7-2.9 1.6-3.9.2 1.4.9 2.2 1.9 2.4C10.2 8 11 5.6 12 3Z"/></svg><div class="dash">—</div></div>
        </div>
        <div class="label">Activity</div>
      </div>
      <div class="tile">
        <div class="disc"><div class="bg"></div><div class="track"></div>
          <div class="content"><svg viewBox="0 0 24 24"><path d="M12 20C12 20 4 15.2 4 9.2 4 6.4 6.2 5 8.5 6.2 10 7 12 8.8 12 8.8 12 8.8 14 7 15.5 6.2 17.8 5 20 6.4 20 9.2 20 15.2 12 20 12 20Z"/></svg><div class="dash">—</div></div>
        </div>
        <div class="label">Heart rate</div>
      </div>
    </div>
    <div style="text-align:center;margin-top:44px">
      <button class="cta" style="margin:0">Continue</button>
    </div>
    <a href="#" class="skip">Explore the app first</a>
  </div>
</body>
</html>
