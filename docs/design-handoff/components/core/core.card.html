<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body{font-family:var(--font-sans);background:var(--fog);margin:0;padding:20px;color:var(--ink)}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);width:100%;margin-bottom:-8px}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Toggle, Chip, Card, SettingsRow, InfoTip } = window.NguyenInDoubtDataDisplaysOuraStyle_d0b3eb;
    function Demo() {
      const [on, setOn] = React.useState(true);
      return (
        <div>
          <div className="row">
            <div className="lab">Button</div>
            <Button variant="primary">Start day one</Button>
            <Button variant="ghost">Continue with email</Button>
            <Button variant="quiet">Not now</Button>
            <Button variant="danger">Sign out</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
          <div className="row">
            <div className="lab">Toggle · Chip</div>
            <Toggle on={on} onChange={setOn} ariaLabel="demo" />
            <Toggle on={false} ariaLabel="off" />
            <span style={{fontSize:13,fontWeight:600,display:'inline-flex',alignItems:'center',gap:6}}>HRV <InfoTip term="Heart rate variability">The tiny timing differences between heartbeats. Higher usually means your system is rested.</InfoTip></span>
            <Chip selected>Meditation</Chip>
            <Chip flagged selected>Alcohol</Chip>
            <Chip>Caffeine</Chip>
            <Chip dot={false}>All tags</Chip>
          </div>
          <div className="row" style={{alignItems:'stretch'}}>
            <div className="lab">Card + SettingsRow</div>
            <div style={{flex:1,minWidth:300}}>
              <Card label="Daily" note="2 of 3 on">
                <SettingsRow first label="Morning reading" description="One note when your scores are ready" control="toggle" on />
                <SettingsRow label="Evening wind-down" value="9:45p" />
              </Card>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
