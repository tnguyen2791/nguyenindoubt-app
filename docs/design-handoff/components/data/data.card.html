<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body{font-family:var(--font-sans);background:var(--fog);margin:0;padding:20px;color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .cell{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
  .lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-bottom:12px}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ScoreRing, ContributorBar, TrendBars, BaselineBand } = window.NguyenInDoubtDataDisplaysOuraStyle_d0b3eb;
    function Demo() {
      return (
        <div className="grid">
          <div className="cell" style={{display:'flex',gap:16,alignItems:'center'}}>
            <ScoreRing score={82} label="balanced" />
            <ScoreRing score={58} label="pay attention" size={90} strokeWidth={10} color="var(--state-attention)" />
          </div>
          <div className="cell">
            <div className="lab">Contributors</div>
            <div style={{display:'grid',gap:10}}>
              <ContributorBar name="Resting HR" state="optimal" />
              <ContributorBar name="HRV balance" state="good" />
              <ContributorBar name="Recovery index" state="pay attention" />
            </div>
          </div>
          <div className="cell">
            <div className="lab">Trend · 7 nights</div>
            <TrendBars height={100} data={[
              {display:'7.4',percent:78,label:'M',color:'#74863F'},
              {display:'6.1',percent:64,label:'T',color:'#C0784A'},
              {display:'6.8',percent:71,label:'W',color:'#A08B48'},
              {display:'7.9',percent:92,label:'T',color:'#537B3D'},
              {display:'5.7',percent:52,label:'F',color:'#C4633E'},
              {display:'7.1',percent:74,label:'S',color:'#8C8E49'},
              {display:'7.6',percent:84,label:'S',color:'#688343'},
            ]} />
          </div>
          <div className="cell">
            <div className="lab">Baseline range</div>
            <BaselineBand name="Resting HR" display="51 bpm" value={51} min={44} max={72}
              bandStart={49} bandEnd={58} minLabel="44" maxLabel="72" baselineLabel="58 baseline" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
