<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NguyenInDoubt mental-health companion MVP.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="NguyenInDoubt">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>NguyenInDoubt</title>
  <link rel="manifest" href="manifest.json">

  <!-- On-brand native loader (ONB-01): fills the pre-Flutter paint with the
       fog ground + centered brand mark instead of a blank white frame.
       Static markup only — no dynamic interpolation, no external URLs. -->
  <style>
    #nid-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F6F7F1;
      transition: opacity 400ms ease-out;
    }
    #nid-loader.nid-loader-out {
      opacity: 0;
      pointer-events: none;
    }
    #nid-loader .nid-badge {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border-radius: 14px;
      animation: nid-breathe 2400ms ease-in-out infinite;
    }
    #nid-loader img {
      width: 96px;
      height: 96px;
      border-radius: 8px;
      display: block;
    }
    @keyframes nid-breathe {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="nid-loader" aria-hidden="true">
    <div class="nid-badge">
      <img src="nid-brand-mark.png" alt="">
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      var removed = false;
      function removeLoader() {
        if (removed) { return; }
        removed = true;
        var loader = document.getElementById('nid-loader');
        if (!loader) { return; }
        loader.classList.add('nid-loader-out');
        window.setTimeout(function () {
          if (loader.parentNode) { loader.parentNode.removeChild(loader); }
        }, 450);
      }
      window.addEventListener('flutter-first-frame', removeLoader);
      // Defensive fallback: never trap the user behind the loader if the
      // first-frame event is missed.
      window.setTimeout(removeLoader, 8000);
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
